[package]
name = "wh-graph"
version = "0.1.0"
edition = "2021"
description = "Build a petgraph bundle from a Wahapedia corpus v1 directory."
publish = false

[[bin]]
name = "wh-graph"
path = "src/main.rs"

[dependencies]
caseless = "=0.2.1"
# petgraph 0.6 pulls indexmap 2. Keep a release this Rust 1.83 toolchain can parse.
indexmap = "=2.6.0"
clap = { version = "=4.5.20", features = ["derive"] }
petgraph = { version = "=0.6.5", features = ["serde-1"] }
postcard = { version = "=1.0.10", features = ["use-std"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"

[dev-dependencies]
serde_json = "=1.0.128"
