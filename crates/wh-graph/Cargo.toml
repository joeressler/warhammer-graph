[package]
name = "wh-graph"
version = "0.1.0"
edition = "2021"
description = "Build a CozoDB graph bundle from a Wahapedia corpus v1 directory."
publish = false

[[bin]]
name = "wh-graph"
path = "src/main.rs"

[dependencies]
caseless = "=0.2.1"
clap = { version = "=4.5.20", features = ["derive"] }
cozo = { version = "=0.7.6", default-features = false, features = ["storage-sqlite", "storage-sqlite-src", "graph-algo"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"

[dev-dependencies]
serde_json = "=1.0.128"
