[package]
name = "wh-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "MCP server that exposes a Wahapedia graph bundle to agents over stdio."
publish = false

[[bin]]
name = "wh-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.5.0", features = ["server", "macros", "transport-io"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = { version = "=1.0.128", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "io-std"] }
wh-ask = { path = "../wh-ask" }

[dev-dependencies]
wh-graph = { path = "../wh-graph" }
