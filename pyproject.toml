[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wh-corpus"
version = "0.1.0"
description = "Download the Wahapedia 10th-edition export and write corpus v1. powered by Wahapedia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.22",
    "pydantic>=2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wh-corpus = "wh_corpus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wh_corpus"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"docs/schemas/corpus-v1.schema.json" = "wh_corpus/corpus-v1.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
